name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Validate Release Token
        shell: bash
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT secret is not set."
            echo "Please create a fine-grained PAT and register it as repository secret RELEASE_PAT."
            exit 1
          fi

      - name: Build And Publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: yarn dist:publish
